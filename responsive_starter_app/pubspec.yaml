name: responsive_iot_2026
description: "Responsive IoT 2026 — a Flutter starter for BLE & WiFi device scanning."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core / UI ---
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3

  # --- App metadata ---
  package_info_plus: ^8.1.0
  device_info_plus: ^11.2.0

  # --- State management ---
  provider: ^6.1.2

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Localization (EN + JA) ---
  intl: ^0.20.2

  # --- Bluetooth LE scan + connect ---
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # --- WiFi scanning (Android full; iOS connected-network only) ---
  wifi_scan: ^0.4.1+2
  network_info_plus: ^6.1.1

  # --- mDNS/Bonjour discovery for the optional WiFi relay proxy ---
  nsd: ^2.3.1

  # --- Settings persistence ---
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Code-gen the AppLocalizations class from lib/l10n/*.arb at build
  # time. See l10n.yaml for the template + output paths.
  generate: true

  assets:
    - assets/images/icon-192.png

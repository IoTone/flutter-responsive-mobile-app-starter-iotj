allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some older transitive plugins (e.g. nsd_android) don't declare an
// `android.namespace`, which Android Gradle Plugin 8+ requires. Inject
// one from the plugin's Gradle `group` (which matches its legacy
// AndroidManifest package) so the build configures cleanly.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

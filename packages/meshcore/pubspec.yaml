name: meshcore
description: >-
  Pure-Dart implementation of the Meshcore companion-radio protocol
  (codec, models, crypto, session). No Flutter dependencies — the
  conformance suite runs under `dart test` with no device or emulator.
version: 0.0.7
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  # Crypto split by capability (neither library covers both needs):
  #  * pointycastle — SYMMETRIC: raw AES-128-ECB (block-by-block,
  #    zero-padded final block), HMAC-SHA256, SHA-256/512.
  #    `package:cryptography` deliberately omits ECB.
  #  * cryptography — ASYMMETRIC: Ed25519 verify + X25519 ECDH.
  #    pointycastle 3.9.x ships no Ed25519/X25519.
  # See meshmore-sns-spec.md → Crypto layer / Risks (crypto exactness).
  pointycastle: ^3.9.1
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
